```html
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Triagem da Síndrome do X Frágil — Login</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/script.js" defer></script>
</head>
<body>
  <main class="card">
    <h1 id="titulo">Entrar</h1>
    <p id="subtitulo" class="subtitulo">
      Bem-vindo de volta! Acesse sua conta.
    </p>

    <!-- LOGIN -->
    <form id="form-login" class="form">
      <label for="login-email">E-mail</label>
      <input
        type="email"
        id="login-email"
        placeholder="voce@email.com"
        required
      >

      <label for="login-senha">Senha</label>
      <input
        type="password"
        id="login-senha"
        placeholder="Sua senha"
        required
      >

      <button type="submit">Entrar</button>
    </form>

    <!-- CADASTRO -->
    <form id="form-cadastro" class="form oculto">
      <label for="cad-nome">Nome</label>
      <input
        type="text"
        id="cad-nome"
        placeholder="Seu nome"
        required
      >

      <label for="cad-email">E-mail</label>
      <input
        type="email"
        id="cad-email"
        placeholder="voce@email.com"
        required
      >

      <label for="cad-senha">Senha</label>
      <input
        type="password"
        id="cad-senha"
        placeholder="Crie uma senha"
        minlength="6"
        required
      >

      <label for="cad-confirma">Confirmar senha</label>
      <input
        type="password"
        id="cad-confirma"
        placeholder="Repita a senha"
        minlength="6"
        required
      >

      <button type="submit">Criar conta</button>
    </form>

    <p class="troca">
      <span id="texto-troca">Não tem conta?</span>
      <a href="#" id="link-troca">Cadastre-se</a>
    </p>
  </main>
</body>
</html>
```
